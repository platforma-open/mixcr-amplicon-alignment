packages:
  - block
  - kind
  - model
  - test
  - ui
  - workflow

catalog:
  # SDK packages - EXACT VERSIONS (no ^ or ~)
  '@milaboratories/ts-builder': 1.8.0
  '@milaboratories/ts-configs': 1.4.1
  '@platforma-sdk/workflow-tengo': 6.22.2
  '@platforma-sdk/model': 1.88.16
  '@platforma-sdk/ui-vue': 1.88.16
  '@platforma-sdk/tengo-builder': 4.1.21
  '@platforma-sdk/package-builder': 3.17.0
  '@platforma-sdk/block-tools': 2.19.1
  '@platforma-sdk/test': 1.88.16
  '@milaboratories/helpers': 1.14.7

  # Common dependencies - can use ^ or ~
  # vue pinned exactly: @platforma-sdk/ui-vue depends on vue 3.5.24, and a ^ range
  # lets pnpm resolve a second copy (3.5.25), causing duplicate-Vue type errors.
  'vue': 3.5.44
  'typescript': ~5.6.3
  'turbo': ~2.11.10
  'vitest': ^4.0.18
  'eslint': ^9.25.1
  '@changesets/cli': ^2.29.8

  # Block-specific dependencies
  '@platforma-open/milaboratories.runenv-python-3': 1.1.16
  '@platforma-open/milaboratories.software-mixcr': 4.7.0-415-develop
  '@platforma-open/milaboratories.software-repseqio': ^2.5.0-37-master
  'ag-grid-enterprise': &ag-grid ~34.1.2
  'ag-grid-vue3': *ag-grid
  '@vueuse/core': ^13.5.0
  '@zip.js/zip.js': ^2.8.2
  '@types/wicg-file-system-access': ^2023.10.6
  '@platforma-open/milaboratories.samples-and-data': ^1.18.0
  'zod': ^3.23.8
  shx: ~0.4.0
  "@platforma-sdk/block-kind": 1.1.1
  "@milaboratories/pl-model-common": 1.51.0
  "es-toolkit": 1.41.0
  cross-env: ~10.1.0
minimumReleaseAgeExclude:
  - "@milaboratories/*"
  - "@platforma-sdk/*"
  - "@platforma-open/*"
allowBuilds:
  "@platforma-open/milaboratories.software-repseqio": false
  "@platforma-open/milaboratories.software-mixcr": false
  "@milaboratories/tengo-tester": false
  esbuild: false
  protobufjs: false
  "@milaboratories/pframes-rs-node": true
